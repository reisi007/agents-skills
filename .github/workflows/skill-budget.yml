name: Skill budget

# Run always, no `paths` filter: this repo is tiny, and a path-filtered required
# check would stay pending on an unrelated PR — see the `github-ci-filters`
# skill.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7   # major tag pin
      - uses: actions/setup-node@v7   # major tag pin
        with:
          node-version: lts/*
      - name: Validate the skill budget
        uses: all-the-rest/ratchet-cli@0db64e280b024cf5a71c5c8a780dff8b9abf732f # v0.6.2
        with:
          version: v0.6.2
          tier: fast
      - name: Render the report
        if: always()
        shell: bash
        run: ratchet report --format md >> "$GITHUB_STEP_SUMMARY"
